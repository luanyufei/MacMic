<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3C72" />
      <stop offset="100%" stop-color="#2A5298" />
    </linearGradient>
    <linearGradient id="mic" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D2FF" />
      <stop offset="100%" stop-color="#3A7BD5" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>
  
  <!-- Rounded App Background -->
  <rect x="32" y="32" width="448" height="448" rx="100" ry="100" fill="url(#bg)" filter="url(#shadow)" />
  
  <!-- Mic Capsule -->
  <rect x="206" y="110" width="100" height="180" rx="50" ry="50" fill="url(#mic)" />
  
  <!-- Mic Arc Stand -->
  <path d="M 166 220 C 166 310, 346 310, 346 220" fill="none" stroke="#FFFFFF" stroke-width="20" stroke-linecap="round" />
  
  <!-- Stand Pole -->
  <line x1="256" y1="310" x2="256" y2="380" stroke="#FFFFFF" stroke-width="20" stroke-linecap="round" />
  
  <!-- Stand Base -->
  <line x1="196" y1="380" x2="316" y2="380" stroke="#FFFFFF" stroke-width="20" stroke-linecap="round" />
  
  <!-- Sound waves -->
  <path d="M 120 180 C 100 220, 100 260, 120 300" fill="none" stroke="#64D2FF" stroke-width="12" stroke-linecap="round" opacity="0.8" />
  <path d="M 392 180 C 412 220, 412 260, 392 300" fill="none" stroke="#64D2FF" stroke-width="12" stroke-linecap="round" opacity="0.8" />
</svg>
